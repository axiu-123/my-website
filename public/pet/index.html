<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2.5D 桌宠</title><style>html,body{margin:0;height:100%;background:#f5f5f7;font-family:-apple-system,Segoe UI,sans-serif}#m{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#999;font-size:14px}</style></head><body><div id="m">2.5D 桌宠加载中…</div><script>const N=12;const W=2;(async()=>{try{const buf=[];for(let i=0;i<N;i++){const u='parts/pet.part'+String(i).padStart(W,'0');const r=await fetch(u);if(!r.ok)throw new Error(u+' '+r.status);buf.push(await r.arrayBuffer());}const blob=new Blob(buf,{type:'text/html'});location.href=URL.createObjectURL(blob);}catch(e){document.getElementById('m').textContent='桌宠加载失败：'+e.message;}})();</script></body></html>
