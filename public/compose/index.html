<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 智能作曲 · 多功能聚合站</title>
<link rel="stylesheet" href="/assets/style.css" />
<style>
  .recommend {
    background: var(--card, #fff);
    border: 1px dashed var(--accent, #ff9100);
    border-radius: 10px; padding: 10px 14px; margin: 10px 0; display: none;
  }
  .mode-switch { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
  .mode {
    flex: 1; min-width: 200px; padding: 12px; border-radius: 10px; cursor: pointer;
    border: 2px solid var(--line, #ddd); background: var(--card, #fff); color: var(--text, #222);
    font-size: 15px; font-weight: 600; transition: .15s;
  }
  .mode.active { border-color: var(--accent, #ff9100); background: var(--accent, #ff9100); color: #fff; }
  .mode small { display: block; font-weight: 400; font-size: 12px; opacity: .9; margin-top: 4px; }

  /* 步骤指示器 */
  .steps { display: flex; gap: 6px; margin: 10px 0 16px; padding: 0; list-style: none; }
  .steps li {
    flex: 1; text-align: center; font-size: 12px; padding: 6px 4px; border-radius: 8px;
    background: var(--card, #fff); border: 1px solid var(--line, #ddd); color: #888;
  }
  .steps li.on { background: var(--accent, #ff9100); color: #fff; border-color: var(--accent, #ff9100); }

  .genre-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin: 10px 0; }
  .genre-card {
    display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 10px; cursor: pointer;
    border: 2px solid var(--line, #ddd); background: var(--card, #fff); color: var(--text, #222); text-align: left;
  }
  .genre-card span { font-size: 12px; opacity: .75; }
  .genre-card.main { border-color: var(--accent, #ff9100); }
  .genre-card.chosen { background: var(--accent, #ff9100); color: #fff; border-color: var(--accent, #ff9100); }
  .genre-card.chosen span { opacity: .9; }

  .frag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 10px 0; }
  .frag-card { border: 1px solid var(--line, #ddd); border-radius: 10px; padding: 12px; background: var(--card, #fff); }
  .frag-pick { font-size: 13px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .frag-name { font-weight: 600; margin: 8px 0 4px; }

  .edit-box { border: 1px solid var(--line, #ddd); border-radius: 10px; padding: 12px; margin: 10px 0; background: var(--card, #fff); }
  .edit-title { font-weight: 600; margin-bottom: 8px; }
  .edit-box label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; margin-bottom: 8px; }
  .edit-box select, .edit-box input[type=number] { padding: 4px 6px; }

  .adv-nav { display: flex; gap: 10px; margin-top: 16px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row > div { display: flex; flex-direction: column; gap: 4px; }
  .row label { font-size: 13px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main>
  <div class="panel">
    <h2>🎼 AI 智能作曲（参考 Suno）</h2>
    <p class="desc">全部在本地浏览器端生成，无需联网、无需密钥。提供两种模式：<b>基础模式</b>由 AI 读提示词直接生成；<b>高级模式</b>由 AI 领航，陪你选类型、挑片段、做修改，最终 AI 主导完成整首歌。</p>

    <label>创作提示词（自然语言，可选，两种模式通用）</label>
    <input type="text" id="prompt" placeholder="例如：一段悲伤但燃起来的史诗感音乐，适合游戏高潮" />
    <div class="recommend" id="recommend"></div>

    <div class="mode-switch">
      <button class="mode active" id="modeBasic">🎯 基础模式<small>AI 直接生成完整音乐</small></button>
      <button class="mode" id="modeAdv">🧭 高级模式<small>AI 领航：选类型→挑片段→改→成曲</small></button>
    </div>

    <!-- ============ 基础模式 ============ -->
    <div id="basicPanel">
      <div class="row">
        <div>
          <label>风格 / 情绪</label>
          <select id="mood">
            <option value="happy">流行 Pop</option>
            <option value="sad">悲伤 Ballad</option>
            <option value="electronic">电子 / EDM</option>
            <option value="chinese">古风 / 中国风</option>
            <option value="lofi">Lo-Fi 放松</option>
            <option value="epic">史诗 / 电影感</option>
            <option value="jazz">爵士 Jazz</option>
            <option value="rock">摇滚 Rock</option>
            <option value="ambient">氛围 / 纯音乐</option>
            <option value="rnb">R&B / 慢摇</option>
            <option value="classical">古典 Classical</option>
          </select>
        </div>
        <div>
          <label>速度 (BPM)</label>
          <input type="number" id="bpm" value="110" min="60" max="180" />
        </div>
        <div>
          <label>小节数</label>
          <input type="number" id="bars" value="8" min="2" max="32" />
        </div>
      </div>
      <div style="margin-top:14px;">
        <button class="primary" id="gen">🎲 生成并播放</button>
      </div>
      <div class="result" id="out" style="display:none;"></div>
      <p class="note">说明：基础模式为 AI 直接生成式作曲（Tone.js 合成），每次点击带随机性可得不同版本。乐器已按风格分类：流行用钢琴/电钢、摇滚用失真电吉他与摇滚贝斯、爵士用萨克斯与爵士低音、古典用钢琴与弦乐等。</p>
    </div>

    <!-- ============ 高级模式 ============ -->
    <div id="advPanel" style="display:none;">
      <ol class="steps">
        <li class="step-dot on">① 选类型</li>
        <li class="step-dot">② 挑片段</li>
        <li class="step-dot">③ 改片段</li>
        <li class="step-dot">④ 成曲</li>
      </ol>

      <div id="advStep1"></div>
      <div id="advStep2" style="display:none;"></div>
      <div id="advStep3" style="display:none;"></div>
      <div id="advStep4" style="display:none;"></div>

      <div class="adv-nav">
        <button class="ghost" id="advBack" style="visibility:hidden;">← 上一步</button>
        <button class="primary" id="advNext">下一步 →</button>
      </div>
    </div>

    <!-- 通用控制 -->
    <div style="margin-top:18px; border-top:1px solid var(--line,#ddd); padding-top:14px;">
      <button class="ghost" id="stop">⏹ 停止</button>
      <button class="ghost" id="dl" style="margin-left:10px;">⬇ 导出 WAV</button>
    </div>
  </div>
</main>
<footer class="foot">多功能聚合站</footer>
<script src="/assets/common.js"></script>
<script src="/compose/app.js"></script>
<script>renderNav('compose');</script>
</body>
</html>
