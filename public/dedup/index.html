<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>文件查重 · 多功能聚合站</title>
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
<header class="topbar" id="topbar"></header>
<main>
  <div class="panel">
    <h2>🔍 文件查重 · 标记重复项</h2>
    <p class="desc">选择一个文件夹，程序会对每个文件计算 SHA-256 指纹，找出内容完全相同的重复文件并标记。确认后可一键将重复项移入「重复文件」文件夹（保留每组首个原件）。</p>

    <button class="primary" id="pick">选择文件夹</button>
    <span id="dirName" class="note"></span>

    <label><input type="checkbox" id="recursive" checked /> 包含子文件夹</label>

    <button class="primary" id="scan" disabled>开始查重</button>
    <div id="result" style="margin-top:14px;"></div>
    <button class="ghost" id="quarantine" style="display:none;">隔离重复项（移入「重复文件」文件夹）</button>
    <p class="note">所有计算在本地浏览器完成，文件不会被上传。大文件较多时哈希计算可能稍慢，请耐心等待。</p>
  </div>
</main>
<footer class="foot">多功能聚合站</footer>
<script src="/assets/common.js"></script>
<script src="/dedup/app.js"></script>
<script>renderNav('dedup');</script>
</body>
</html>
