<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>文件查重 · 多功能聚合站</title>
<link rel="stylesheet" href="/assets/style.css" />
<style>
  .playable { cursor: pointer; text-decoration: underline dotted; }
  .playable:hover { color: var(--accent); }
  .playing { background: rgba(255, 145, 0, 0.18) !important; }
  .playbtn {
    border: 1px solid var(--accent, #ff9100);
    background: transparent;
    color: var(--accent, #ff9100);
    border-radius: 6px;
    padding: 2px 8px;
    cursor: pointer;
    font-size: 12px;
  }
  .playbtn:hover { background: var(--accent, #ff9100); color: #fff; }
  .player-bar {
    position: sticky;
    bottom: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: var(--card, #fff);
    border: 1px solid var(--line, #ddd);
    border-radius: 10px;
    padding: 8px 12px;
    margin-top: 14px;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.06);
  }
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main>
  <div class="panel">
    <h2>🔍 文件查重 · 标记 / 清理重复项</h2>
    <p class="desc">选择一个文件夹，找出重复文件。支持两种模式：<b>精确模式</b>按内容 SHA-256 指纹比对（字节完全相同才算重复）；<b>高级模式</b>按文件名相似度比对（适合"名字略有不同、其实是同一首歌"的情况，例如带/不带歌手、含 Live/Remastered/伴奏等版本词）。</p>

    <button class="primary" id="pick">选择文件夹</button>
    <span id="dirName" class="note"></span>

    <label><input type="checkbox" id="recursive" checked /> 包含子文件夹</label>

    <div class="modebox">
      <div class="mode-title">查重模式</div>
      <label class="mode-opt"><input type="radio" name="mode" value="exact" checked /> 精确（内容完全相同）</label>
      <label class="mode-opt"><input type="radio" name="mode" value="adv" /> 高级（同名疑似 · 按文件名相似）</label>
      <div id="advOptions" class="adv-opts" style="display:none;">
        <label>相似度阈值：<span id="thVal">0.82</span>
          <input type="range" id="threshold" min="0.6" max="0.95" step="0.01" value="0.82" />
        </label>
        <label><input type="checkbox" id="sameExt" checked /> 仅同类型文件互比（取消可把 .mp3 与 .flac 同一首合并）</label>
      </div>
    </div>

    <button class="primary" id="scan" disabled>开始查重</button>
    <div id="result" style="margin-top:14px;"></div>

    <div id="actions" class="actions" style="display:none;">
      <button class="danger" id="deleteSel">删除选中项 (<span id="delCount">0</span>)</button>
      <button class="ghost" id="selectDups">全选重复项</button>
      <button class="ghost" id="quarantine">隔离重复项（移入「重复文件」文件夹）</button>
    </div>
    <p class="note">所有计算在本地浏览器完成，文件不会被上传。删除操作会直接移除文件且不可恢复，请确认勾选无误后再执行。</p>

    <div id="playerBar" class="player-bar" style="display:none;">
      <span id="nowPlaying" class="note"></span>
      <audio id="player" controls style="height:34px;"></audio>
      <button id="stopPlay" class="ghost" style="margin-left:4px;">停止</button>
    </div>
  </div>
</main>
<footer class="foot">多功能聚合站</footer>
<script src="/assets/common.js"></script>
<script src="/dedup/similar.js"></script>
<script src="/dedup/app.js"></script>
<script>renderNav('dedup');</script>
</body>
</html>
